
name: Build Cricket Mechanic APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: Cricket-Mechanic-Android-Project/Cricket-Mechanic
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Cricket-Mechanic-Testing-APK
          path: Cricket-Mechanic-Android-Project/Cricket-Mechanic/app/build/outputs/apk/debug/app-debug.apk
